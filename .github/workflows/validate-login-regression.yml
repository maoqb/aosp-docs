name: Validate OAuth navigation regression
on:
  push:
    branches:
      - fix/oauth-login-no-silent-intercept
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate login and editor
        run: |
          node --check editor/app.js
          node --check editor/mindmap-editor.js
          node --test tests/login-link.test.cjs
          node --test tests/mindmap-editor.test.cjs
          node --test tests/diagram-paths.test.cjs
      - name: Check deployed OAuth backend
        run: |
          curl -fsS --max-time 20 'https://aosp-notes-api.maoqb.workers.dev/health' | grep -q '"ok":true'
          curl -sS --max-time 20 -D /tmp/oauth_headers -o /dev/null 'https://aosp-notes-api.maoqb.workers.dev/auth/start'
          grep -qi '^location: https://github.com/login/oauth/authorize?' /tmp/oauth_headers
