name: Validate Studio redesign
on:
  push:
    branches:
      - feature/studio-redesign-visual-mindmap
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/checkout@v6
        with:
          repository: maoqb/Notes
          ref: main
          path: Notes
          ssh-key: ${{ secrets.NOTES_DEPLOY_KEY }}
          persist-credentials: false
      - name: Validate editor and mind map behavior
        run: |
          node --check editor/app.js
          node --check editor/mindmap-core.js
          node --check editor/mindmap-editor.js
          node --check editor/diagram-paths.js
          node --test tests/*.test.cjs
          python3 -m py_compile scripts/prepare_docs.py
      - name: Build complete VitePress site
        run: |
          npm ci
          npm run build
          test -s dist/editor/index.html
          test -s dist/editor/mindmap-editor.js
          test -s dist/editor/mindmap-core.js
