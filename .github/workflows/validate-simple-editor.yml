name: Validate simplified editor
on:
  push:
    branches:
      - chore/remove-worker-settings
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check standalone editor
        run: |
          node --check editor/app.js
          node --check editor/diagram-paths.js
          node --test tests/diagram-paths.test.cjs
          ! grep -q 'setupBtn\|applyWorker\|notes-worker-url' editor/app.js
          ! grep -q 'id="settings"\|id="setupBtn"' editor/index.html
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download private Notes
        uses: actions/checkout@v6
        with:
          repository: maoqb/Notes
          ref: main
          path: Notes
          ssh-key: ${{ secrets.NOTES_DEPLOY_KEY }}
          persist-credentials: false
      - name: Full blog build
        run: |
          npm ci
          npm run build
          test -s dist/editor/index.html
          test -s dist/editor/app.js
