name: Validate existing draw.io editing
on:
  push:
    branches:
      - feature/edit-existing-drawio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch private Notes
        id: notes
        run: echo "sha=$(git rev-parse HEAD:Notes)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: maoqb/Notes
          ref: ${{ steps.notes.outputs.sha }}
          path: Notes
          ssh-key: ${{ secrets.NOTES_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: JavaScript and diagram path tests
        run: |
          node --check editor/app.js
          node --check editor/diagram-paths.js
          node --test tests/diagram-paths.test.cjs
          python3 -m py_compile scripts/prepare_docs.py
      - name: Build static editor and VitePress
        run: |
          npm ci
          npm run build
          test -s dist/editor/index.html
          test -s dist/editor/app.js
          test -s dist/editor/diagram-paths.js
