name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve Notes revision
        id: notes-revision
        run: echo "sha=$(git rev-parse HEAD:Notes)" >> "$GITHUB_OUTPUT"

      - name: Check out Notes
        uses: actions/checkout@v6
        with:
          repository: maoqb/Notes
          ref: ${{ steps.notes-revision.outputs.sha }}
          path: Notes
          ssh-key: ${{ secrets.NOTES_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare documentation tree
        run: python scripts/prepare_docs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: python -m mkdocs build --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
