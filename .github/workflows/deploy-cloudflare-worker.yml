name: Deploy Notes Studio Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/notes-studio-rename-20261124

permissions:
  contents: read

concurrency:
  group: deploy-notes-studio-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          NOTES_GITHUB_CLIENT_ID: ${{ secrets.NOTES_GITHUB_CLIENT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_KV_NAMESPACE_ID NOTES_GITHUB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::Configure $name in Settings > Secrets and variables > Actions"
              exit 1
            fi
          done

      - name: Build temporary production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          NOTES_GITHUB_CLIENT_ID: ${{ secrets.NOTES_GITHUB_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          source = Path("editor-worker/wrangler.jsonc")
          config = json.loads(source.read_text(encoding="utf-8"))
          if config.get("name") != "aosp-notes-api":
              raise SystemExit("Refusing to deploy unexpected Worker")
          config["account_id"] = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          config["vars"]["GITHUB_CLIENT_ID"] = os.environ["NOTES_GITHUB_CLIENT_ID"]
          config["kv_namespaces"][0]["id"] = os.environ["CLOUDFLARE_KV_NAMESPACE_ID"]
          if config["vars"].get("EDITOR_ORIGIN") != "https://maoqb.github.io":
              raise SystemExit("Unexpected editor origin")
          if config["vars"].get("EDITOR_URL") != "https://maoqb.github.io/aosp-docs/editor/":
              raise SystemExit("Unexpected editor URL")
          Path("editor-worker/wrangler.ci.json").write_text(json.dumps(config), encoding="utf-8")
          PY

      - name: Deploy updated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: editor-worker
        run: npx --yes wrangler@latest deploy --config wrangler.ci.json

      - name: Verify Worker health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://aosp-notes-api.maoqb.workers.dev/health \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("repo") == "maoqb/Notes"; print("Worker health check passed")'

      - name: Remove temporary configuration
        if: always()
        run: rm -f editor-worker/wrangler.ci.json
