<text x="450.0" y="244.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">KATI_shell_no_rerun out/release-config \</text>
<text x="450.0" y="258.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">  --product … --release … --variant …</text>
<text x="450.0" y="272.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">  --maps-file … --hashfile …</text>
<line x1="558" y1="290" x2="742" y2="290" stroke="#000" stroke-width="1.5"  marker-end="url(#arr-block)"/>
<text x="650.0" y="294.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">ReadReleaseConfigMaps()</text>
<text x="650.0" y="308.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">(并发读取所有 textproto)</text>
<line x1="742" y1="340" x2="558" y2="340" stroke="#000" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-open)"/>
<text x="650.0" y="344.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">return *ReleaseConfigs</text>
<line x1="558" y1="390" x2="742" y2="390" stroke="#000" stroke-width="1.5"  marker-end="url(#arr-block)"/>
<text x="650.0" y="394.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">GetReleaseConfig(targetRelease)</text>
<text x="650.0" y="408.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">→ GenerateReleaseConfig()</text>
<line x1="742" y1="440" x2="558" y2="440" stroke="#000" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-open)"/>
<text x="650.0" y="444.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">return *ReleaseConfig</text>
<path d="M550,490 L610,490 L610,520 L550,520" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr-block)"/>
<text x="614" y="498.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">WriteMakefile(</text>
<text x="614" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">  release_config-&lt;product&gt;.varmk)</text>
<path d="M550,540 L610,540 L610,570 L550,570" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr-block)"/>
<text x="614" y="548.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">WriteHashFile(files_used.hash)</text>
<line x1="542" y1="590" x2="358" y2="590" stroke="#000" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-open)"/>
<text x="450.0" y="594.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">exit 0</text>
<path d="M350,640 L410,640 L410,670 L350,670" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr-block)"/>
<text x="414" y="648.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">include release_config-&lt;product&gt;.varmk</text>
<text x="414" y="662.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">→ ALL_RELEASE_CONFIGS_FOR_PRODUCT</text>
<text x="414" y="676.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="normal" fill="#000000">→ RELEASE_* 变量全部生效</text>
<line x1="358" y1="690" x2="942" y2="690" stroke="#000" stroke-width="1.5"  marker-end="url(#arr-block)"/>
