# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: AOSP Notes
site_description: Android / AOSP Framework 技术笔记
site_url: https://maoqb.github.io/aosp-docs/
repo_url: https://github.com/maoqb/aosp-docs
repo_name: maoqb/aosp-docs

docs_dir: .generated_docs
site_dir: site
use_directory_urls: true

# 不声明 nav：MkDocs 会自动扫描 docs_dir，并按现有目录层级生成导航。
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - tables
  - fenced_code
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 2-6
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

copyright: Copyright &copy; AOSP Notes
