# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Android Framework
site_description: Android / AOSP Framework 技术笔记
site_url: https://aosp-notes-maoqb.realqingbo.chatgpt.site/

docs_dir: .generated_docs
site_dir: site
use_directory_urls: true

# 左侧 Notes 菜单由准备脚本扫描源目录生成，无需维护固定 nav。
theme:
  name: material
  custom_dir: .generated_overrides
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

hooks:
  - hooks/search_html.py

markdown_extensions:
  - tables
  - fenced_code
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 2-6
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

copyright: Copyright &copy; Android Framework

extra_css:
  - assets/stylesheets/blog.css?v=18

extra_javascript:
  - assets/javascripts/blog.js?v=8

extra:
  author: maoqb
  author_role: Android Framework 开发者
  tagline: 深入 Android Framework，记录 AOSP 源码里的设计与实现
  categories:
    - Android Framework
    - WindowManager
    - Build System
  blog_tags:
    - AOSP
    - Android
    - Framework
    - WMS
    - Release Config
    - 源码分析
