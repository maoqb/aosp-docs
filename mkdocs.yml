# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Android Framework
site_description: Android / AOSP Framework 技术笔记
site_url: https://aosp-notes-maoqb.realqingbo.chatgpt.site/

docs_dir: .generated_docs
site_dir: site
use_directory_urls: true

# 不声明 nav：MkDocs 会自动扫描 docs_dir，并按现有目录层级生成导航。
theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

hooks:
  - hooks/search_html.py

markdown_extensions:
  - tables
  - fenced_code
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 2-6
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

copyright: Copyright &copy; Android Framework

extra_css:
  - assets/stylesheets/blog.css?v=13

extra_javascript:
  - assets/javascripts/blog.js?v=6

extra:
  author: maoqb
  author_role: Android Framework 开发者
  tagline: 深入 Android Framework，记录 AOSP 源码里的设计与实现
  categories:
    - Android Framework
    - WindowManager
    - Build System
  blog_tags:
    - AOSP
    - Android
    - Framework
    - WMS
    - Release Config
    - 源码分析
  posts:
    - title: Android Release Config：从配置加载到构建产物
      url: release_config/release_config/
      date: "2026-06-09"
      created_at: "2026-06-09T23:47:58+08:00"
      category: Build System
