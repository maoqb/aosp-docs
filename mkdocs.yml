      excerpt: 从源码与数据布局出发，拆解 release_config 的核心数据结构、并发加载、继承解析、命令行工具和编译期完整时序。
    - title: 强制 App 窗口大小与位置：从 Rect 到屏幕像素
      url: AI-Generated/force_app_bounds_principles.html
      date: "2026-08-28"
